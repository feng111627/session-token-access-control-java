server.port=0

security.token-secret=dev-only-secret-change-me
security.access-token-ttl-millis=120000
security.refresh-token-ttl-millis=3600000
security.login-max-failures=5
security.login-lock-millis=300000
security.rule-version=v1
security.resources=documents,reports,admin-console
security.rules[0]=documents:read:USER,ADMIN
security.rules[1]=documents:write:ADMIN
security.rules[2]=reports:read:USER,ADMIN
security.rules[3]=admin-console:read:ADMIN
