server.port=0

# ---- 令牌 ----
# 本地开发用签名密钥，生产环境必须替换
security.token.secret=local-dev-secret-change-me
# 访问令牌有效期（秒），短期
security.token.access-ttl-seconds=300
# 刷新令牌有效期（秒），较长期
security.token.refresh-ttl-seconds=604800

# ---- 登录限流与锁定 ----
# 同一账号窗口内允许的最大失败次数
security.login.max-failures-per-account=5
# 同一来源窗口内允许的最大失败次数
security.login.max-failures-per-source=20
# 失败计数窗口（秒）
security.login.window-seconds=600
# 锁定/限流时长（秒），到期自动解除
security.login.lock-seconds=300

# ---- 鉴权规则（按顺序匹配，命中即止；无命中默认拒绝）----
security.policy.rules[0].id=public-none
security.policy.rules[0].path=/api/never-matches
security.policy.rules[0].roles=
security.policy.rules[0].scope=any

security.policy.rules[1].id=documents-read
security.policy.rules[1].path=/api/documents/**
security.policy.rules[1].roles=ROLE_USER,ROLE_ADMIN
security.policy.rules[1].scope=read

security.policy.rules[2].id=documents-write
security.policy.rules[2].path=/api/documents/**
security.policy.rules[2].roles=ROLE_USER,ROLE_ADMIN
security.policy.rules[2].scope=write

security.policy.rules[3].id=admin-only
security.policy.rules[3].path=/api/admin/**
security.policy.rules[3].roles=ROLE_ADMIN
security.policy.rules[3].scope=any
